name: krishora-insight

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: krishora
    ports:
      - "5437:5432"
    volumes:
      - krishora_pg:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=40
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    cpus: 0.25

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/krishora
      CORE_AUTH_SECRET_KEY: ${CORE_AUTH_SECRET_KEY:-dev_secret_key_only_for_local_development_do_not_use_in_prod}
      CORE_API_URL: ${CORE_API_URL:-http://rattanshanti-backend:8010}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,https://krishora-dev-core.rattanshanti.org,https://krishora-api-dev-core.rattanshanti.org
      PROJECT_NAME: krishora-insight
    ports:
      - "8105:8105"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks:
      - default
      - core

volumes:
  krishora_pg:

networks:
  core:
    external: true
    name: core-api_rattanshanti-net
