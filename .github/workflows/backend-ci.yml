name: Krishora Insight Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    uses: rattanshanti/ci-templates/.github/workflows/python-backend-ci.yml@develop
    with:
      working-directory: .
      uv-sync-args: '--dev'
      cache-dependency-glob: uv.lock
    secrets: inherit
